syntax = "proto3";

package meshtastic;

import "nanopb.proto";

message CrisislabMessage {
	message Empty {}

	message SignalData {
		message Entry {
			uint32 from = 1; // node id
			int32 rssi = 2;
			float snr = 3;
		}

		uint32 to = 1; // node id
		bool is_gateway = 2;
		repeated Entry links = 3;
	}

	oneof message {
		uint32 broadcast_interval_seconds = 1;
		string channel_name = 2;
		Empty update_routes = 3;
		uint64 ping_timestamp = 4;
		SignalData signal_data = 5;
	}
}
