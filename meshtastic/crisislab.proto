syntax = "proto3";

package meshtastic;

import "nanopb.proto";
import "meshtastic/mesh.proto";
import "meshtastic/telemetry.proto";

message CrisislabMessage {
	message SignalData {
		message Entry {
			uint32 from = 1; // node id
			int32 rssi = 2;
			float snr = 3;
		}

		uint32 to = 1; // node id
		bool is_gateway = 2;
		repeated Entry links = 3;
	}

	message MeshSettings {
		optional uint32 broadcast_interval_seconds = 1;
		optional string channel_name = 2;
		optional uint32 ping_timeout_seconds = 3;
	}

	message ServerSettings {
		optional uint32 signal_data_timeout_seconds = 1;
	}

	message Empty {}

	message RoutesMap {
		message Route {
			repeated uint32 node_ids = 1;
		}

		message RoutesList {
			repeated Route routes = 1;
		}

		map<uint32, RoutesList> entries = 1;
	}

	message LiveData {
		uint32 node_num = 1;
		uint64 timestamp = 2; // seconds since unix epoch
		User user = 3;
		Position position = 4;
		DeviceMetrics device_metrics = 5;
	}

	oneof message {
		MeshSettings mesh_settings = 1;
		ServerSettings server_settings = 2;
		Empty update_routes_request = 3;
		uint64 ping_timestamp = 4; // seconds since unix epoch
		SignalData signal_data = 5;
		RoutesMap updated_routes = 6;
		LiveData live_data = 7;
	}
}
